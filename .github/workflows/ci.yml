name: LabPilot checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      MAIL_BACKEND: mock
      OPENAI_API_KEY: test-not-a-real-key
      CHECKPOINT_DB_PATH: ':memory:'
      REMINDER_SCHEDULER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install uv
      - run: uv sync --frozen
      - run: uv run ruff check app tests scripts
      - run: uv run pytest -q
      - run: npm ci && npm audit --audit-level=high && npm run test:smoke && npm run build
        working-directory: frontend
      - run: docker build -t labpilot:ci .
      - run: uv run python scripts/container_smoke.py --image labpilot:ci
